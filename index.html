<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jornadas · Welcome Weddings</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEBE4; --card:#FFFFFF; --soft:#F3F0EA; --soft2:#EAE6DD;
  --ink:#2A2521; --text2:#5C554C; --text3:#9A917F;
  --border:#ECE7DD; --border2:#DFD8CA;
  --gold:#B08D4F; --gold-dark:#9C7B40; --gold-soft:#F6F0E4;
  --red:#B43A3A; --red-bg:#FBF1F0; --red-border:#EDCFCB;
  --green:#2E7D54; --green-bg:#F1F8F3; --green-border:#CDE5D4;
  --amber:#9A6B1F; --amber-bg:#FBF5E9; --amber-border:#ECDDBC;
  --radius:18px; --radius-sm:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;line-height:1.55;padding:26px 18px 80px}
.wrap{max-width:1080px;margin:0 auto}
textarea,input,select{font-family:'Inter',sans-serif}
textarea{resize:none;overflow:hidden}

/* ===== TOPO ===== */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
.logo{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:18px;flex-shrink:0}
.top-title{font-weight:600;font-size:15px}
.top-sub{font-size:11.5px;color:var(--text3)}
.jtabs{margin-left:auto;display:flex;gap:8px}
.jtab{border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:600;color:var(--text2);padding:9px 18px;border-radius:12px;cursor:pointer;transition:all .15s}
.jtab:hover{border-color:var(--border2)}
.jtab.active{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 2px 8px rgba(176,141,79,.35)}

.subbar{display:flex;align-items:center;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.fbtn{border:1px solid var(--border2);background:var(--card);border-radius:99px;padding:5px 14px;font-size:12px;cursor:pointer;color:var(--text2);transition:all .15s;font-weight:500}
.fbtn:hover{border-color:var(--gold)}
.fbtn.active{background:var(--ink);border-color:var(--ink);color:#fff}
.statline{margin-left:auto;font-size:12px;color:var(--text3)}
.statline b{color:var(--ink);font-weight:600}

/* ===== FASES + GRID ===== */
.panel{display:none}
.panel.active{display:block}
.fase-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dark);margin:26px 0 12px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.fase-label .fl-line{flex:1;height:1px;background:var(--border2)}
.fase-label .fl-prog{font-weight:600;color:var(--text3);letter-spacing:0;text-transform:none;font-size:11.5px}
.fase-label .fl-tog{color:var(--text3);transition:transform .15s;font-size:12px}
.fase-label.collapsed .fl-tog{transform:rotate(-90deg)}
.fase-label input{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-dark);border:1px dashed var(--border2);background:none;border-radius:6px;padding:3px 8px;outline:none;min-width:220px}
.cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.cards-grid.collapsed{display:none}
.btn-newcard{border:1px dashed var(--border2);background:none;border-radius:var(--radius);padding:16px;font-size:13px;color:var(--text3);cursor:pointer;transition:all .15s;text-align:center;min-height:90px;display:flex;align-items:center;justify-content:center}
.btn-newcard:hover{border-color:var(--gold);color:var(--gold-dark)}
.btn-newfase{display:block;width:100%;border:1px dashed var(--border2);background:none;border-radius:var(--radius);padding:14px;font-size:13px;color:var(--text3);cursor:pointer;transition:all .15s;margin-top:26px}
.btn-newfase:hover{border-color:var(--gold);color:var(--gold-dark)}

.pcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;cursor:pointer;transition:all .15s;box-shadow:0 1px 3px rgba(42,37,33,.04);display:flex;flex-direction:column;gap:10px}
.pcard:hover{border-color:var(--gold);box-shadow:0 6px 20px rgba(42,37,33,.08);transform:translateY(-1px)}
.pcard.done{opacity:.62}
.pcard-title{font-family:'Playfair Display',serif;font-size:16.5px;font-weight:600;line-height:1.3}
.pcard-desc{font-size:12.5px;color:var(--text2);flex:1}
.pcard-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:600;border-radius:99px;padding:2px 9px}
.pcard-foot{display:flex;gap:7px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--border);padding-top:10px}
.mini{font-size:11px;font-weight:600;border-radius:99px;padding:3px 10px}
.mini.prob{background:var(--red-bg);color:var(--red)}
.mini.msg{background:var(--gold-soft);color:var(--gold-dark)}
.mini.sol{background:var(--green-bg);color:var(--green)}
.mini.zero{background:var(--soft);color:var(--text3);font-weight:500}
.mini.status{margin-left:auto;border:1px solid}
.mini.st-todo{border-color:var(--red-border);background:var(--red-bg);color:var(--red)}
.mini.st-doing{border-color:var(--amber-border);background:var(--amber-bg);color:var(--amber)}
.mini.st-done{border-color:var(--green-border);background:var(--green-bg);color:var(--green)}
.empty{text-align:center;padding:46px;color:var(--text3);font-size:13.5px;display:none}

/* ===== MODAL (card aberto) ===== */
.overlay{position:fixed;inset:0;background:rgba(42,37,33,.38);display:none;align-items:flex-start;justify-content:center;padding:36px 14px;overflow-y:auto;z-index:100}
.overlay.show{display:flex}
.detail{background:var(--card);border-radius:26px;box-shadow:0 24px 70px rgba(42,37,33,.25);max-width:780px;width:100%;padding:32px 38px 38px;animation:pop .18s ease;margin-bottom:40px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.detail-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:20px}
.detail-title-ta{font-family:'Playfair Display',serif;font-size:24px;font-weight:600;border:none;background:none;outline:none;width:100%;color:var(--ink);line-height:1.25;border-bottom:1px dashed transparent}
.detail-title-ta:hover,.detail-title-ta:focus{border-bottom-color:var(--border2)}
.detail-sub{font-size:12px;color:var(--text3);margin-top:5px}
.hd-btn{width:34px;height:34px;border:none;background:none;color:var(--text3);font-size:17px;cursor:pointer;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.hd-btn:hover{background:var(--soft);color:var(--ink)}
.hd-btn.del:hover{background:var(--red-bg);color:var(--red)}

.pills{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.pill{display:inline-flex;align-items:center;gap:8px;border:none;font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:12px;cursor:pointer;transition:all .15s;background:var(--soft);color:var(--text2)}
.pill:hover{background:var(--soft2)}
.pill.active{background:var(--gold);color:#fff;box-shadow:0 2px 8px rgba(176,141,79,.35)}
.pill .n{font-size:11px;background:rgba(0,0,0,.10);border-radius:99px;padding:1px 7px}
.pill.active .n{background:rgba(255,255,255,.25)}
.tabview{display:none}
.tabview.active{display:block}
.flabel{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin:20px 0 8px}
.tabview > .flabel:first-child{margin-top:0}
.det-input{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--soft);padding:11px 14px;font-size:13px;color:var(--text2);outline:none;line-height:1.55}
.det-input:focus{border-color:var(--gold);background:var(--card)}
input.det-input{background:var(--card)}

/* problemas */
.prob-card{border:1px solid var(--red-border);background:var(--red-bg);border-radius:var(--radius-sm);margin-bottom:9px;overflow:hidden}
.prob-card-head{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;cursor:pointer}
.prob-arrow{color:var(--red);font-size:11px;margin-top:5px;transition:transform .15s;flex-shrink:0;display:inline-block}
.prob-arrow.open{transform:rotate(90deg)}
.prob-title-ta{flex:1;border:none;background:none;outline:none;font-size:13px;color:#6E2424;font-weight:500;line-height:1.5}
.prob-title-ta::placeholder{color:#C08080}
.btn-rm{border:none;background:none;color:inherit;opacity:.45;cursor:pointer;font-size:15px;flex-shrink:0;padding:2px 4px}
.btn-rm:hover{opacity:1}
.prob-body{display:none;padding:2px 14px 13px 32px;border-top:1px dashed var(--red-border)}
.prob-body.open{display:block}
.sub-lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A05050;margin:11px 0 5px}
.sub-input{width:100%;border:1px solid var(--red-border);border-radius:7px;background:#fff;padding:7px 10px;font-size:12.5px;color:#6E2424;outline:none}
.sub-input:focus{border-color:var(--red)}
.sub-row{display:flex;gap:7px;align-items:flex-start;margin-bottom:6px}
.sub-num{width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid var(--red-border);color:var(--red);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:6px}
.sub-ta{flex:1;border:1px solid var(--red-border);border-radius:7px;background:#fff;padding:7px 10px;font-size:12.5px;color:#6E2424;outline:none;line-height:1.5}
.sub-ta:focus{border-color:var(--red)}
.btn-add{border:1px dashed var(--border2);background:none;border-radius:var(--radius-sm);padding:9px 14px;font-size:12px;color:var(--text3);cursor:pointer;width:100%;text-align:left;transition:all .15s;margin-top:4px}
.btn-add:hover{border-color:var(--gold);color:var(--gold-dark)}
.btn-add.sm{padding:6px 11px;font-size:11.5px;margin-top:2px}

/* mensagens */
.wa-wrap{background:#EFEAE2;background-image:radial-gradient(rgba(180,160,130,.10) 1px, transparent 1px);background-size:14px 14px;border-radius:var(--radius);padding:16px;border:1px solid var(--border)}
.msg-item{display:flex;gap:10px;margin-bottom:14px}
.msg-item:last-child{margin-bottom:0}
.msg-circle{width:24px;height:24px;border-radius:50%;background:var(--gold);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:4px}
.msg-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bubble{background:#fff;border-radius:4px 12px 12px 12px;padding:9px 12px 11px;box-shadow:0 1px 1px rgba(0,0,0,.07)}
.bubble.sugestao{background:#F4FAF1;border:1px solid #CBE3C4;border-radius:12px 4px 12px 12px}
.bubble-tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:99px;padding:2px 8px;margin-bottom:6px;background:var(--soft);color:var(--text3)}
.bubble-tag.sug{background:#DDF0D6;color:#2E6B3C}
.bubble-head{display:flex;gap:8px;align-items:center;margin-bottom:5px}
.bubble-label{flex:1;border:none;background:none;outline:none;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-dark)}
.bubble-label::placeholder{color:#C9B68F;font-weight:600}
.bubble-ta{width:100%;border:none;background:none;outline:none;font-size:12.5px;line-height:1.55;color:#2F2A24}
.bubble-ta::placeholder{color:#B5AC9C}
.msg-hint{font-size:11.5px;color:var(--text3);margin-top:10px;font-style:italic}

/* soluções */
.sol-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.sol-ta{flex:1;border:1px solid var(--green-border);border-radius:var(--radius-sm);background:var(--green-bg);padding:10px 13px;font-size:13px;color:#1C4D33;outline:none;line-height:1.55}
.sol-ta:focus{border-color:var(--green);background:#fff}
.sol-ta::placeholder{color:#7FAE92}
.sol-row .btn-rm{color:var(--green);margin-top:8px}
.meta-grid{display:grid;grid-template-columns:auto 1fr 1fr;gap:12px;align-items:end;margin-top:6px}
.status-sel{font-size:12.5px;font-weight:600;border-radius:99px;padding:8px 16px;border:1px solid;cursor:pointer;background:none;outline:none;-webkit-appearance:none;appearance:none}
.status-sel.st-todo{color:var(--red);border-color:var(--red-border);background:var(--red-bg)}
.status-sel.st-doing{color:var(--amber);border-color:var(--amber-border);background:var(--amber-bg)}
.status-sel.st-done{color:var(--green);border-color:var(--green-border);background:var(--green-bg)}

footer{text-align:center;padding:34px 0 0;font-size:11px;color:var(--text3)}

@media(max-width:760px){
  body{padding:16px 10px 60px}
  .cards-grid{grid-template-columns:1fr}
  .jtabs{margin-left:0;width:100%}
  .jtab{flex:1}
  .statline{margin-left:0;width:100%}
  .detail{padding:22px 16px 26px;border-radius:20px}
  .pills{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
  .pill{white-space:nowrap}
  .meta-grid{grid-template-columns:1fr}
  .msg-pair{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="logo">W</div>
    <div>
      <div class="top-title">Welcome Weddings</div>
      <div class="top-sub">Atendimento à Viagem · Mapeamento de Jornadas</div>
    </div>
    <div class="jtabs">
      <button class="jtab" id="jtab-casal" onclick="switchTab('casal')">Jornada do Casal</button>
      <button class="jtab active" id="jtab-convidado" onclick="switchTab('convidado')">Jornada do Convidado</button>
    </div>
  </div>

  <div class="subbar">
    <button class="fbtn active" data-filter="all" onclick="filterCards('all',this)">Todas</button>
    <button class="fbtn" data-filter="todo" onclick="filterCards('todo',this)">A resolver</button>
    <button class="fbtn" data-filter="doing" onclick="filterCards('doing',this)">Em andamento</button>
    <button class="fbtn" data-filter="done" onclick="filterCards('done',this)">Resolvido</button>
    <div class="statline" id="statline"></div>
  </div>

  <div class="panel" id="panel-casal"></div>
  <div class="panel active" id="panel-convidado"></div>
  <div class="empty" id="empty-state">Nenhuma etapa encontrada com esse filtro.</div>

  <footer>Welcome Weddings · Jornadas do Casal e do Convidado — Tudo salvo automaticamente neste navegador</footer>
</div>

<div class="overlay" id="overlay">
  <div class="detail" id="detail"></div>
</div>

        {
          titulo:'Cadência de reuniões — com ação promocional ≤ 45 dias',

// ─────────────────────────────────────────────
// STATE  (mesma chave e formato da versão anterior)
// ─────────────────────────────────────────────
const SK = 'ww_jornadas_v1';
let state = {};
let currentTab = 'convidado';
let currentIdx = null;
let cardIdx = 0;
const cardMeta = {};   // idx → {tab, faseId}
const cardSource = {}; // idx → DATA card original (tags) ou null

function loadState(){ try{ const s=localStorage.getItem(SK); if(s) state=JSON.parse(s); }catch(e){ state={}; } }
function saveState(){ try{ localStorage.setItem(SK,JSON.stringify(state)); }catch(e){} }

function getCS(idx){
  if(!state[idx]) state[idx]={status:'todo',titulo:'',processo:'',responsavel:'',prazo:'',problemas:[],solucoes:[],acoes:[]};
  if(!state[idx].acoes) state[idx].acoes=[];
  state[idx].problemas = (state[idx].problemas||[]).map(function(p){
    if(!p) return {texto:'',comoEnviado:'',oQueEnviado:['']};
    if(typeof p==='string') return {texto:p, comoEnviado:'', oQueEnviado:['']};
    if(!p.oQueEnviado) p.oQueEnviado=[''];
    if(!p.texto) p.texto='';
    if(!p.comoEnviado) p.comoEnviado='';
    return p;
  });
  if(!state[idx].problemas.length) state[idx].problemas=[{texto:'',comoEnviado:'',oQueEnviado:['']}];
  if(!state[idx].solucoes) state[idx].solucoes=[];
  return state[idx];
}
function mkProblema(t){ return {texto:t||'', comoEnviado:'', oQueEnviado:['']}; }
function esc(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&#34;'); }
function autoResize(ta){ if(!ta||ta.tagName!=='TEXTAREA') return; ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; }

// estruturas extras persistidas dentro do mesmo state
function getCF(){ if(!state.__cf) state.__cf={casal:[],convidado:[]}; if(!state.__cf.casal) state.__cf.casal=[]; if(!state.__cf.convidado) state.__cf.convidado=[]; return state.__cf; }
function getCC(){ if(!state.__cc) state.__cc=[]; return state.__cc; }
function getDel(){ if(!state.__del) state.__del=[]; return state.__del; }

// ─────────────────────────────────────────────
// CONTADORES
// ─────────────────────────────────────────────
function countProb(cs){ return cs.problemas.filter(p=>((p&&p.texto)||'').trim()).length; }
function countMsg(cs){ return (cs.acoes||[]).filter(a=>(((a&&a.label)||'')+((a&&a.texto)||'')+((a&&a.sugestao)||'')).trim()).length; }
function countSol(cs){ return (cs.solucoes||[]).filter(s=>(s||'').trim()).length; }
const STATUS_TXT={todo:'● A resolver',doing:'● Em andamento',done:'✓ Resolvido'};

// ─────────────────────────────────────────────
// RENDER GERAL
// ─────────────────────────────────────────────
function faseSectionHtml(fase, tab, custom){
  const titleHtml = custom
    ? '<input type="text" value="'+esc(fase.title)+'" placeholder="Nome da fase..." onclick="event.stopPropagation()" oninput="renameFase(\''+fase.id+'\',\''+tab+'\',this.value)">'
    : '<span>'+esc(fase.title)+'</span>';
  return '<div class="fase-label" id="flabel-'+fase.id+'" onclick="toggleFase(\''+fase.id+'\')">'
    + titleHtml
    + '<span class="fl-line"></span>'
    + '<span class="fl-prog" id="fprog-'+fase.id+'"></span>'
    + '<span class="fl-tog">▾</span>'
    + '</div>'
    + '<div class="cards-grid" id="fgrid-'+fase.id+'"></div>';
}

function pcardHtml(idx){
  const cs=getCS(idx);
  const src=cardSource[idx];
  const np=countProb(cs), nm=countMsg(cs), ns=countSol(cs);
  const desc=(cs.processo||'').trim();
  const snippet=desc.length>130?desc.slice(0,130)+'…':desc;
  const tagsHtml=(src&&src.tags?src.tags:[]).map(t=>'<span class="tag" style="background:'+t.s+';color:'+t.c+'">'+esc(t.t)+'</span>').join('');
  return '<div class="pcard '+cs.status+'" data-idx="'+idx+'" data-status="'+cs.status+'" id="pcard-'+idx+'" onclick="openCard('+idx+')">'
    + '<div class="pcard-title">'+(esc(cs.titulo)||'<span style="color:var(--text3)">Sem título</span>')+'</div>'
    + (snippet?'<div class="pcard-desc">'+esc(snippet)+'</div>':'<div class="pcard-desc"></div>')
    + (tagsHtml?'<div class="pcard-tags">'+tagsHtml+'</div>':'')
    + '<div class="pcard-foot">'
    + '<span class="mini '+(np?'prob':'zero')+'">'+np+' problema'+(np===1?'':'s')+'</span>'
    + '<span class="mini '+(nm?'msg':'zero')+'">'+nm+' mensage'+(nm===1?'m':'ns')+'</span>'
    + '<span class="mini '+(ns?'sol':'zero')+'">'+ns+' solu&ccedil;'+(ns===1?'&atilde;o':'&otilde;es')+'</span>'
    + '<span class="mini status st-'+cs.status+'">'+STATUS_TXT[cs.status]+'</span>'
    + '</div></div>';
}

function rebuildPcard(idx){
  const el=document.getElementById('pcard-'+idx);
  if(!el) return;
  el.outerHTML=pcardHtml(idx);
}

function renderAll(){
  cardIdx=0;
  const del=getDel();
  ['casal','convidado'].forEach(tab=>{
    const panel=document.getElementById('panel-'+tab);
    panel.innerHTML='';
    DATA[tab].forEach(fase=>{
      panel.insertAdjacentHTML('beforeend', faseSectionHtml(fase, tab, false));
      const grid=document.getElementById('fgrid-'+fase.id);
      fase.cards.forEach(card=>{
        const idx=cardIdx++;
        cardMeta[idx]={tab, faseId:fase.id};
        cardSource[idx]=card;
        const isNew=!state[idx];
        const cs=getCS(idx);
        if(!cs.titulo) cs.titulo=card.titulo;
        if(!cs.processo) cs.processo=card.processo;
        if(!cs.responsavel) cs.responsavel=card.responsavel;
        if(!cs.prazo) cs.prazo=card.prazo;
        if(isNew && card.problemas.length) cs.problemas=card.problemas.map(p=>typeof p==='string'?mkProblema(p):(p||mkProblema('')));
        if(!cs.problemas.length) cs.problemas=[mkProblema('')];
        if(!cs.solucoes||!cs.solucoes.length) cs.solucoes=card.solucoes.length?[...card.solucoes]:[''];
        if(del.indexOf(idx)===-1) grid.insertAdjacentHTML('beforeend', pcardHtml(idx));
      });
      grid.insertAdjacentHTML('beforeend','<button class="btn-newcard" onclick="addCard(\''+fase.id+'\',\''+tab+'\')">+ Nova etapa</button>');
    });
  });
  // fases personalizadas
  const cf=getCF();
  ['casal','convidado'].forEach(tab=>{
    const panel=document.getElementById('panel-'+tab);
    cf[tab].forEach(f=>{
      panel.insertAdjacentHTML('beforeend', faseSectionHtml(f, tab, true));
      const grid=document.getElementById('fgrid-'+f.id);
      grid.insertAdjacentHTML('beforeend','<button class="btn-newcard" onclick="addCard(\''+f.id+'\',\''+tab+'\')">+ Nova etapa</button>');
    });
    panel.insertAdjacentHTML('beforeend','<button class="btn-newfase" onclick="addFase(\''+tab+'\')">+ Nova fase — '+(tab==='casal'?'Jornada do Casal':'Jornada do Convidado')+'</button>');
  });
  // cards personalizados (persistidos)
  let maxIdx=cardIdx-1;
  getCC().forEach(c=>{
    cardMeta[c.idx]={tab:c.tab, faseId:c.faseId};
    cardSource[c.idx]=null;
    getCS(c.idx);
    const grid=document.getElementById('fgrid-'+c.faseId);
    if(grid && del.indexOf(c.idx)===-1){
      const btn=grid.querySelector('.btn-newcard');
      btn.insertAdjacentHTML('beforebegin', pcardHtml(c.idx));
    }
    if(c.idx>maxIdx) maxIdx=c.idx;
  });
  cardIdx=maxIdx+1;
  updateStats();
  updateAllFaseProgs();
}

// ─────────────────────────────────────────────
// TABS / FILTRO / STATS
// ─────────────────────────────────────────────
function switchTab(tab){
  currentTab=tab;
  document.getElementById('jtab-casal').classList.toggle('active',tab==='casal');
  document.getElementById('jtab-convidado').classList.toggle('active',tab==='convidado');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  updateStats();
  const f=document.querySelector('.fbtn.active');
  filterCards(f?f.dataset.filter:'all', f||document.querySelector('.fbtn'));
}

function toggleFase(id){
  document.getElementById('flabel-'+id).classList.toggle('collapsed');
  document.getElementById('fgrid-'+id).classList.toggle('collapsed');
}

function filterCards(status, btn){
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const cards=document.querySelectorAll('#panel-'+currentTab+' .pcard');
  let visible=0;
  cards.forEach(c=>{ const show=status==='all'||c.dataset.status===status; c.style.display=show?'':'none'; if(show) visible++; });
  document.getElementById('empty-state').style.display=visible===0?'block':'none';
}

function updateStats(){
  const cards=document.querySelectorAll('#panel-'+currentTab+' .pcard');
  let doing=0,done=0;
  cards.forEach(c=>{ if(c.dataset.status==='doing') doing++; else if(c.dataset.status==='done') done++; });
  document.getElementById('statline').innerHTML='<b>'+cards.length+'</b> etapas · <b>'+doing+'</b> em andamento · <b>'+done+'</b> resolvidas';
}

function updateAllFaseProgs(){
  document.querySelectorAll('.cards-grid').forEach(grid=>{
    const id=grid.id.replace('fgrid-','');
    const cards=grid.querySelectorAll('.pcard');
    const done=[...cards].filter(c=>c.dataset.status==='done').length;
    const el=document.getElementById('fprog-'+id);
    if(el) el.textContent=done+'/'+cards.length;
  });
}

// ─────────────────────────────────────────────
// MODAL — CARD ABERTO
// ─────────────────────────────────────────────
function faseTitleOf(idx){
  const meta=cardMeta[idx];
  const f=DATA[meta.tab].find(x=>x.id===meta.faseId);
  if(f) return f.title;
  const cf=getCF()[meta.tab].find(x=>x.id===meta.faseId);
  return cf?cf.title:'';
}

function openCard(idx){
  currentIdx=idx;
  const cs=getCS(idx);
  const meta=cardMeta[idx];
  const np=countProb(cs), nm=countMsg(cs), ns=countSol(cs);
  const jor=meta.tab==='casal'?'Jornada do Casal':'Jornada do Convidado';
  const d=document.getElementById('detail');
  d.innerHTML=
    '<div class="detail-head"><div style="flex:1">'
    + '<textarea class="detail-title-ta" rows="1" placeholder="Título da etapa..." oninput="updateF(\'titulo\',this.value);autoResize(this)" onfocus="autoResize(this)">'+esc(cs.titulo)+'</textarea>'
    + '<div class="detail-sub">'+jor+' · '+esc(faseTitleOf(idx))+'</div></div>'
    + '<button class="hd-btn del" title="Remover etapa" onclick="deleteCard()">🗑</button>'
    + '<button class="hd-btn" title="Fechar" onclick="closeCard()">✕</button></div>'
    + '<div class="pills">'
    + '<button class="pill active" id="pill-problema" onclick="modalTab(\'problema\')">⚠️ Problemas <span class="n" id="n-prob">'+np+'</span></button>'
    + '<button class="pill" id="pill-mensagens" onclick="modalTab(\'mensagens\')">💬 Mensagens <span class="n" id="n-msg">'+nm+'</span></button>'
    + '<button class="pill" id="pill-solucoes" onclick="modalTab(\'solucoes\')">✅ Soluções <span class="n" id="n-sol">'+ns+'</span></button>'
    + '</div>'
    + '<div class="tabview active" id="t-problema">'
    + '<div class="flabel">Como funciona hoje</div>'
    + '<textarea class="det-input" rows="2" placeholder="Descreva o processo atual..." oninput="updateF(\'processo\',this.value);autoResize(this)" onfocus="autoResize(this)">'+esc(cs.processo)+'</textarea>'
    + '<div class="flabel">Problemas</div>'
    + '<div id="prob-list">'+cs.problemas.map((p,pi)=>probHtml(pi,p)).join('')+'</div>'
    + '<button class="btn-add" onclick="addProblema()">+ Adicionar problema</button>'
    + '</div>'
    + '<div class="tabview" id="t-mensagens">'
    + '<div class="flabel">Mensagens enviadas nesta etapa</div>'
    + '<div class="wa-wrap"><div id="msg-list">'+(cs.acoes.length?cs.acoes.map((a,ai)=>msgHtml(ai,a)).join(''):'')+'</div>'
    + (cs.acoes.length?'':'<div class="msg-hint" id="msg-empty">Nenhuma mensagem cadastrada nesta etapa ainda.</div>')
    + '</div>'
    + '<button class="btn-add" onclick="addAcao()">+ Adicionar mensagem</button>'
    + '<div class="msg-hint">Dica: use variáveis como {primeiro_nome}, {casal} e {cidade} para os campos dinâmicos do Guest.</div>'
    + '</div>'
    + '<div class="tabview" id="t-solucoes">'
    + '<div class="flabel">Possíveis soluções</div>'
    + '<div id="sol-list">'+cs.solucoes.map((s,si)=>solHtml(si,s)).join('')+'</div>'
    + '<button class="btn-add" onclick="addSol()">+ Adicionar solução</button>'
    + '<div class="flabel" style="margin-top:24px">Acompanhamento</div>'
    + '<div class="meta-grid">'
    + '<div><div class="sub-lbl" style="color:var(--text3)">Status</div>'
    + '<select class="status-sel st-'+cs.status+'" id="status-sel" onchange="changeStatus(this.value)">'
    + '<option value="todo"'+(cs.status==='todo'?' selected':'')+'>● A resolver</option>'
    + '<option value="doing"'+(cs.status==='doing'?' selected':'')+'>● Em andamento</option>'
    + '<option value="done"'+(cs.status==='done'?' selected':'')+'>✓ Resolvido</option></select></div>'
    + '<div><div class="sub-lbl" style="color:var(--text3)">Responsável</div>'
    + '<input class="det-input" type="text" value="'+esc(cs.responsavel)+'" oninput="updateF(\'responsavel\',this.value)"></div>'
    + '<div><div class="sub-lbl" style="color:var(--text3)">Prazo</div>'
    + '<input class="det-input" type="date" value="'+esc(cs.prazo)+'" onchange="updateF(\'prazo\',this.value)"></div>'
    + '</div></div>';
  document.getElementById('overlay').classList.add('show');
  document.body.style.overflow='hidden';
  setTimeout(()=>{ d.querySelectorAll('textarea').forEach(autoResize); },30);
}

function closeCard(){
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow='';
  if(currentIdx!==null){ rebuildPcard(currentIdx); updateStats(); updateAllFaseProgs(); }
  currentIdx=null;
}

function modalTab(id){
  document.querySelectorAll('.tabview').forEach(v=>v.classList.remove('active'));
  document.getElementById('t-'+id).classList.add('active');
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  document.getElementById('pill-'+id).classList.add('active');
  setTimeout(()=>{ document.querySelectorAll('#t-'+id+' textarea').forEach(autoResize); },20);
}

function refreshCounts(){
  const cs=getCS(currentIdx);
  const np=document.getElementById('n-prob'), nm=document.getElementById('n-msg'), ns=document.getElementById('n-sol');
  if(np) np.textContent=countProb(cs);
  if(nm) nm.textContent=countMsg(cs);
  if(ns) ns.textContent=countSol(cs);
}

function updateF(field,value){ const cs=getCS(currentIdx); cs[field]=value; saveState(); }

function changeStatus(value){
  const cs=getCS(currentIdx); cs.status=value; saveState();
  const sel=document.getElementById('status-sel');
  sel.className='status-sel st-'+value;
}

// ── PROBLEMAS ──
function probHtml(pi,p){
  const msgs=(p.oQueEnviado||['']);
  const msgsHtml=msgs.map((m,mi)=>
    '<div class="sub-row"><span class="sub-num">'+(mi+1)+'</span>'
    + '<textarea class="sub-ta" rows="1" placeholder="Descreva a ação ou mensagem..." oninput="updSub('+pi+','+mi+',this.value);autoResize(this)" onfocus="autoResize(this)">'+esc(m)+'</textarea>'
    + '<button class="btn-rm" style="color:var(--red)" onclick="rmSub('+pi+','+mi+')">×</button></div>'
  ).join('');
  return '<div class="prob-card" id="prob-'+pi+'">'
    + '<div class="prob-card-head">'
    + '<span class="prob-arrow" id="parr-'+pi+'" onclick="toggleProb('+pi+')">▶</span>'
    + '<textarea class="prob-title-ta" rows="1" placeholder="⚠ Descreva o problema..." oninput="updProb('+pi+',\'texto\',this.value);autoResize(this)" onfocus="autoResize(this)">'+esc(p.texto)+'</textarea>'
    + '<button class="btn-rm" style="color:var(--red)" onclick="rmProb('+pi+')">×</button></div>'
    + '<div class="prob-body" id="pbody-'+pi+'">'
    + '<div class="sub-lbl">Como é feito</div>'
    + '<input class="sub-input" type="text" placeholder="Ex: manualmente pela Juliana..." value="'+esc(p.comoEnviado)+'" oninput="updProb('+pi+',\'comoEnviado\',this.value)">'
    + '<div class="sub-lbl">O que é feito / enviado</div>'
    + '<div id="subs-'+pi+'">'+msgsHtml+'</div>'
    + '<button class="btn-add sm" onclick="addSub('+pi+')">+ Adicionar ação</button>'
    + '</div></div>';
}
function renderProbs(){
  const cs=getCS(currentIdx);
  document.getElementById('prob-list').innerHTML=cs.problemas.map((p,pi)=>probHtml(pi,p)).join('');
  document.querySelectorAll('#prob-list textarea').forEach(autoResize);
  refreshCounts();
}
function toggleProb(pi){
  document.getElementById('pbody-'+pi).classList.toggle('open');
  document.getElementById('parr-'+pi).classList.toggle('open');
  setTimeout(()=>{ document.querySelectorAll('#pbody-'+pi+' textarea').forEach(autoResize); },20);
}
function updProb(pi,field,value){ const cs=getCS(currentIdx); if(cs.problemas[pi]){ cs.problemas[pi][field]=value; saveState(); if(field==='texto') refreshCounts(); } }
function addProblema(){ const cs=getCS(currentIdx); cs.problemas.push(mkProblema('')); saveState(); renderProbs(); const list=document.getElementById('prob-list'); const ta=list.lastElementChild.querySelector('.prob-title-ta'); if(ta) ta.focus(); }
function rmProb(pi){
  const cs=getCS(currentIdx);
  if(cs.problemas.length<=1){ cs.problemas[0]=mkProblema(''); }
  else cs.problemas.splice(pi,1);
  saveState(); renderProbs();
}
function addSub(pi){ const cs=getCS(currentIdx); cs.problemas[pi].oQueEnviado.push(''); saveState(); renderProbs(); document.getElementById('pbody-'+pi).classList.add('open'); document.getElementById('parr-'+pi).classList.add('open'); }
function updSub(pi,mi,value){ const cs=getCS(currentIdx); if(cs.problemas[pi]&&cs.problemas[pi].oQueEnviado) cs.problemas[pi].oQueEnviado[mi]=value; saveState(); }
function rmSub(pi,mi){
  const cs=getCS(currentIdx); const arr=cs.problemas[pi].oQueEnviado;
  if(arr.length<=1) arr[0]=''; else arr.splice(mi,1);
  saveState(); renderProbs(); document.getElementById('pbody-'+pi).classList.add('open'); document.getElementById('parr-'+pi).classList.add('open');
}

// ── MENSAGENS ──
function msgHtml(ai,a){
  return '<div class="msg-item" id="msg-'+ai+'">'
    + '<div class="msg-circle">'+(ai+1)+'</div>'
    + '<div style="flex:1;min-width:0">'
    + '<div class="bubble-head" style="margin-bottom:6px">'
    + '<input class="bubble-label" style="background:none" type="text" placeholder="Ex: Perfil 1 · Só hospedagem" value="'+esc(a.label)+'" oninput="updAcao('+ai+',\'label\',this.value)">'
    + '<button class="btn-rm" onclick="rmAcao('+ai+')">×</button></div>'
    + '<div class="msg-pair">'
    + '<div class="bubble atual"><div class="bubble-tag">Atual</div>'
    + '<textarea class="bubble-ta" rows="2" placeholder="Cole aqui a mensagem que é enviada hoje..." oninput="updAcao('+ai+',\'texto\',this.value);autoResize(this)" onfocus="autoResize(this)">'+esc(a.texto)+'</textarea></div>'
    + '<div class="bubble sugestao"><div class="bubble-tag sug">Sugestão</div>'
    + '<textarea class="bubble-ta" rows="2" placeholder="Escreva aqui a nova versão proposta..." oninput="updAcao('+ai+',\'sugestao\',this.value);autoResize(this)" onfocus="autoResize(this)">'+esc(a.sugestao||'')+'</textarea></div>'
    + '</div></div></div>';
}
function renderMsgs(){
  const cs=getCS(currentIdx);
  document.getElementById('msg-list').innerHTML=cs.acoes.map((a,ai)=>msgHtml(ai,a)).join('');
  const empty=document.getElementById('msg-empty'); if(empty) empty.style.display=cs.acoes.length?'none':'';
  document.querySelectorAll('#msg-list textarea').forEach(autoResize);
  refreshCounts();
}
function addAcao(){ const cs=getCS(currentIdx); cs.acoes.push({label:'',texto:'',sugestao:''}); saveState(); renderMsgs(); const list=document.getElementById('msg-list'); const inp=list.lastElementChild.querySelector('input'); if(inp) inp.focus(); }
function updAcao(ai,field,value){ const cs=getCS(currentIdx); if(cs.acoes[ai]){ cs.acoes[ai][field]=value; saveState(); refreshCounts(); } }
function rmAcao(ai){ const cs=getCS(currentIdx); cs.acoes.splice(ai,1); saveState(); renderMsgs(); }

// ── SOLUÇÕES ──
function solHtml(si,s){
  return '<div class="sol-row" id="sol-'+si+'">'
    + '<textarea class="sol-ta" rows="1" placeholder="💡 Descreva uma solução..." oninput="updSol('+si+',this.value);autoResize(this)" onfocus="autoResize(this)">'+esc(s)+'</textarea>'
    + '<button class="btn-rm" onclick="rmSol('+si+')">×</button></div>';
}
function renderSols(){
  const cs=getCS(currentIdx);
  document.getElementById('sol-list').innerHTML=cs.solucoes.map((s,si)=>solHtml(si,s)).join('');
  document.querySelectorAll('#sol-list textarea').forEach(autoResize);
  refreshCounts();
}
function addSol(){ const cs=getCS(currentIdx); cs.solucoes.push(''); saveState(); renderSols(); const list=document.getElementById('sol-list'); const ta=list.lastElementChild.querySelector('textarea'); if(ta) ta.focus(); }
function updSol(si,value){ const cs=getCS(currentIdx); cs.solucoes[si]=value; saveState(); refreshCounts(); }
function rmSol(si){
  const cs=getCS(currentIdx);
  if(cs.solucoes.length<=1) cs.solucoes[0]=''; else cs.solucoes.splice(si,1);
  saveState(); renderSols();
}

// ─────────────────────────────────────────────
// ADD / DELETE / FASES
// ─────────────────────────────────────────────
function addCard(faseId, tab){
  const idx=cardIdx++;
  cardMeta[idx]={tab, faseId};
  cardSource[idx]=null;
  const cs=getCS(idx);
  cs.titulo=''; cs.processo=''; cs.responsavel=''; cs.prazo='';
  cs.problemas=[mkProblema('')]; cs.solucoes=[''];
  getCC().push({idx, tab, faseId});
  saveState();
  const grid=document.getElementById('fgrid-'+faseId);
  const btn=grid.querySelector('.btn-newcard');
  btn.insertAdjacentHTML('beforebegin', pcardHtml(idx));
  updateStats(); updateAllFaseProgs();
  openCard(idx);
}

function deleteCard(){
  if(currentIdx===null) return;
  if(!confirm('Remover esta etapa?')) return;
  const idx=currentIdx;
  const cc=getCC();
  const i=cc.findIndex(c=>c.idx===idx);
  if(i>=0) cc.splice(i,1);
  else { const del=getDel(); if(del.indexOf(idx)===-1) del.push(idx); }
  delete state[idx];
  saveState();
  const el=document.getElementById('pcard-'+idx);
  if(el) el.remove();
  currentIdx=null;
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow='';
  updateStats(); updateAllFaseProgs();
}

function addFase(tab){
  const id=tab[0]+Date.now();
  getCF()[tab].push({id, title:''});
  saveState();
  renderAll();
  switchTab(tab);
  const inp=document.querySelector('#flabel-'+id+' input');
  if(inp) inp.focus();
}

function renameFase(id, tab, value){
  const f=getCF()[tab].find(x=>x.id===id);
  if(f){ f.title=value; saveState(); }
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
document.getElementById('overlay').addEventListener('click',function(e){ if(e.target.id==='overlay') closeCard(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&document.getElementById('overlay').classList.contains('show')) closeCard(); });
loadState();
renderAll();

</script>
</body>
